  <header class="pagehero"><div class="pagehero-inner">
    <div class="eyebrow">BABY SOOTHER · PROP SAFETY</div>
    <h1>安撫師｜道具保管與出班前檢查</h1>
    <p>安撫師負責保管本人使用的道具；每次出班前，必須逐項確認完整、安全、乾淨且可使用。</p>
  </div></header>
  <main class="single">
    <div class="qa-next qa-warning"><b>出班規定</b><br>只要有任何安全、清潔或完整性項目不合格，該道具不得帶出或使用；請先隔離、標記並回報處理。</div>
    <section>
      <div class="card"><h3>道具保管與盤點</h3><div class="checklist" data-items="本人保管的道具已依清單盤點，數量完整。|每件道具放置於指定位置，容易辨識與取用。|乾淨道具與已使用、待清潔道具分開存放。|布類、包巾與小配件以乾燥防塵方式收納。|小型零件與配件有獨立容器，不會散落或遺失。|損壞、待維修或有疑慮的道具已隔離並清楚標記。|收納區保持乾燥、通風，沒有潮濕、霉味或蟲害。"></div></div>
      <div class="card"><h3>清潔與衛生</h3><div class="checklist" data-items="所有會接觸寶寶皮膚的道具已完成清潔或消毒。|包巾、布料、服裝與墊布已清洗並完全乾燥。|道具表面沒有灰塵、毛髮、口水、奶漬或其他污漬。|道具沒有異味、霉斑、潮濕或清潔劑殘留。|使用適合嬰幼兒接觸的清潔方式與用品。|已清潔道具使用乾淨容器或防塵袋包裝。|清潔工具本身乾淨，且不與髒污用品混放。"></div></div>
      <div class="card"><h3>安全檢查</h3><div class="checklist" data-items="道具沒有破裂、尖角、毛刺、外露金屬或其他割傷風險。|螺絲、扣件、黏合處與接縫牢固，沒有鬆脫。|沒有容易脫落或可能被寶寶誤吞的小零件。|承重、支撐與底座穩固，不會傾倒、滑動或塌陷。|包巾、繩帶與配件不會纏繞寶寶頸部或影響呼吸。|材質沒有剝落、掉色、刺激性氣味或過敏疑慮。|電池、電線或發熱用品功能正常，且不會讓寶寶接觸。|道具尺寸與用途適合本次拍攝寶寶的年齡及狀況。"></div></div>
      <div class="card"><h3>出班前必檢</h3><p>每次離開工作室前完成，不可以前一次使用後的檢查代替。</p><div class="checklist" data-items="已核對本次拍攝內容與出班道具清單。|所需主道具、包巾、服裝、墊材及配件全部備齊。|每件帶出的道具均已再次確認安全、乾淨、乾燥。|道具已使用乾淨、防塵且適合搬運的方式包裝。|易碎、易變形或重型道具已固定，運送中不會碰撞或傾倒。|已準備必要的替換品、備用品與臨時清潔用品。|不合格、狀況不明或尚未清潔的道具沒有帶出。|發現缺件、損壞或安全疑慮時，已標記並主動回報。|完成整體複核，確認可以安全出班。"></div></div>
      <div class="card"><h3>使用後歸還</h3><div class="checklist" data-items="使用後已再次盤點，確認沒有遺失或混入客戶物品。|已使用道具已集中放置於待清潔區，不與乾淨道具混放。|發現損壞、污漬或異常已立即標記並回報。|完成清潔、乾燥與安全複查後，才放回指定位置。"></div></div>
    </section>
  </main>
